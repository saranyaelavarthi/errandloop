name: Check ErrandLoop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js && node --check app/static/login.js && node --check app/static/onboarding.js
      - run: npm install --prefix "$RUNNER_TEMP/errandloop-dom" --no-audit --no-fund jsdom@30.1.0
      - run: node scripts/live-dom-test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/errandloop-dom/node_modules
      - run: cfn-lint template.yaml infra/hosted.json
        env:
          AWS_DEFAULT_REGION: ap-south-1
          AWS_EC2_METADATA_DISABLED: 'true'
